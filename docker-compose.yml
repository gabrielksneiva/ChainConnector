version: '3.8'

services:
  # Anvil - Local EVM provider compatible with Sepolia
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: chainconnector-anvil
    ports:
      - "8545:8545"
    entrypoint:
      - /usr/local/bin/anvil
    command:
      - --host
      - "0.0.0.0"
      - --port
      - "8545"
      - --chain-id
      - "11155111"
      - --block-time
      - "2"
      - --accounts
      - "10"
      - --balance
      - "1000"
    environment:
      RUST_LOG: warn
    healthcheck:
      disable: true
    networks:
      - chainconnector-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: chainconnector-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: chainconnector
      POSTGRES_INITDB_ARGS: "-c max_connections=100 -c shared_buffers=256MB -c effective_cache_size=1GB"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d chainconnector"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 3
    networks:
      - chainconnector-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # ChainConnector Service
  chainconnector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chainconnector-service
    environment:
      # RPC Configuration - points to local Anvil
      ETH_RPC_URL: http://anvil:8545
      SEPOLIA_RPC_URL: http://anvil:8545
      
      # Database Configuration
      DATABASE_URL: postgres://user:password@postgres:5432/chainconnector?sslmode=disable
      
      # Server Configuration
      HTTP_ADDR: 0.0.0.0:3000
      HTTP_PORT: "3000"
      
      # Monitoring
      MONITOR_ENABLED: "true"
      MONITOR_INTERVAL_SECONDS: "30"
      
      # Logging
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    depends_on:
      - anvil
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health", "--silent", "--show-error"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - chainconnector-net
    restart: on-failure:5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chainconnector-frontend
    ports:
      - "8080:80"
    depends_on:
      - chainconnector
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost", "--silent", "--show-error"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - chainconnector-net
    restart: on-failure:5
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

volumes:
  postgres-data:
    driver: local

networks:
  chainconnector-net:
    driver: bridge
