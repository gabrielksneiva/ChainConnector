version: '3.8'

services:
  # Anvil - Local EVM provider compatible with Sepolia
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: chainconnector-anvil-test
    ports:
      - "8545:8545"
    entrypoint:
      - /usr/local/bin/anvil
    command:
      - --host
      - "0.0.0.0"
      - --port
      - "8545"
      - --chain-id
      - "11155111"
      - --block-time
      - "2"
      - --accounts
      - "10"
      - --balance
      - "1000"
    environment:
      RUST_LOG: warn
    healthcheck:
      disable: true
    networks:
      - chainconnector-test-net
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: chainconnector-postgres-test
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: chainconnector
      POSTGRES_INITDB_ARGS: "-c max_connections=100 -c shared_buffers=256MB -c effective_cache_size=1GB"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data-test:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d chainconnector"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 3
    networks:
      - chainconnector-test-net
    restart: unless-stopped

  # ChainConnector Service
  chainconnector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chainconnector-service-test
    environment:
      ETH_RPC_URL: http://anvil:8545
      SEPOLIA_RPC_URL: http://anvil:8545
      DATABASE_URL: postgres://user:password@postgres:5432/chainconnector?sslmode=disable
      HTTP_ADDR: 0.0.0.0:3001
      HTTP_PORT: "3001"
      MONITOR_ENABLED: "true"
      MONITOR_INTERVAL_SECONDS: "30"
      LOG_LEVEL: info
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      anvil:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health", "--silent", "--show-error"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - chainconnector-test-net
    restart: on-failure:5

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chainconnector-frontend-test
    ports:
      - "8080:80"
    depends_on:
      chainconnector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost", "--silent", "--show-error"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - chainconnector-test-net
    restart: on-failure:5

  # E2E Tests - Runs only after all services are healthy
  e2e-tests:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    container_name: chainconnector-e2e-test
    depends_on:
      frontend:
        condition: service_healthy
      chainconnector:
        condition: service_healthy
    networks:
      - chainconnector-test-net
    environment:
      # Tests will access services via network
      PLAYWRIGHT_TEST_BASE_URL: http://frontend
      DOCKER_INTERNAL: "true"
    # Exit with non-zero code if tests fail
    # This prevents the compose command from returning success
    command: npm run test:e2e
    # Don't restart on failure - we want to know about it
    restart: "no"

volumes:
  postgres-data-test:
    driver: local

networks:
  chainconnector-test-net:
    driver: bridge
